---
# Test-only override of checklists/checklist-github-actions.yaml.
#
# actionlint-docker's own hook manifest anchors its `files:` selector to
# `^\.github/workflows/` at the repo root. A fixture living under
# tests/fixtures/ can never satisfy that path, and this repo's real
# .github/workflows/ is owned by a different part of the build (Sprint 4,
# not landed yet), so tests/ cannot write there either. This file re-points
# the same pinned actionlint-docker hook at any YAML file, purely so the
# test runner can exercise the tool's real behaviour against a fixture kept
# inside tests/. It intentionally does not exercise the real path selector;
# see tests/README.md for what this test does and does not prove.
repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
        files: \.ya?ml$
