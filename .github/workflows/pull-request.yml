---
# cspell:words zizmor
name: PR Validation

# Two gates on every pull request against main: pre-commit (this repo's
# own dogfood config) and the tests/ self-test suite, plus a labeler pass.
# Nothing here needs a personal access token; a public repo cloning
# itself, applying labels, and commenting on the PR is everything the
# default GITHUB_TOKEN is scoped for. No other services are wired into
# this pipeline. Pre-commit here is a gate, not a fixer: a hook that
# finds a problem fails the job, and nothing in this workflow commits or
# pushes to the PR branch on its own.
#
# A pull request opened from a fork gets a read only GITHUB_TOKEN, so
# labeler and the "Post Pre-Commit Log" job below, the only two things
# here that need pull-requests: write, are guarded at the job level with
# github.event.pull_request.head.repo.fork != true. The guard sits on
# the job rather than on a step inside it, because a step level guard
# still stands the job up and grants it write permission before deciding
# not to use it; a job level guard means neither job is even scheduled
# for a fork's pull request. The pre-commit job itself carries no such
# guard and keeps only contents: read: it runs the pull request's own
# hook code, and a read only token is exactly the safe scope for a job
# that executes untrusted input, fork or not. That job's result and log
# are exposed as outputs so the comment job can report them without
# checking out anything or running a line of hook code itself.

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# A new push supersedes whatever this workflow is still doing for the same
# PR, so a rapid series of pushes doesn't leave several stale runs racing
# each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    # This workflow's only trigger is pull_request (see "on" above), so
    # github.event.pull_request is always present here and this field is
    # always a real boolean, never null; != true and == false would read
    # identically in that case. != true is used anyway, as the form that
    # keeps reading correctly if a future edit ever adds a trigger, such
    # as workflow_dispatch, that this job could then run under with no
    # pull_request context to read at all.
    if: github.event.pull_request.head.repo.fork != true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # This job only reads the tree to decide which labels apply; it
          # never pushes, so the checkout has no use for a persisted
          # credential.
          persist-credentials: false

      - name: Apply labels from .github/labeler.yml
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  pre-commit:
    name: Pre-Commit Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      log: ${{ steps.capture.outputs.log }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # No ref: override. The default for a pull_request event is
          # GitHub's merge ref, the PR branch merged into main, which is
          # what will actually land if this PR is merged, and that is the
          # more useful thing for a quality gate to check. The head branch
          # tip only mattered while this job pushed an auto-fix commit
          # back to it; nothing here pushes any more.
          # check-branch-name.sh reads GITHUB_HEAD_REF, which GitHub sets
          # for every pull_request run regardless of which ref is checked
          # out, so branch name validation is unaffected by this choice.
          #
          # This job only runs pre-commit against the code; it never
          # pushes, so the checkout has no use for a persisted credential.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Only the checklists/pre-commit-config side of the hook environment
      # cache; the Terraform/tflint binaries below are cached by their own
      # setup actions.
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml', 'checklists/*.yaml') }}
          restore-keys: |
            pre-commit|

      # checklist-dev-terraform (terraform-fmt, terraform-validate, tflint)
      # expects both binaries already on PATH; the hook itself installs
      # nothing. terraform_wrapper: false so terraform-validate talks to the
      # real binary rather than hashicorp's stdout-wrapping shim.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: Install pre-commit
        run: pip install "pre-commit==4.5.1"

      # A hook that only reformats, such as end-of-file-fixer or
      # ruff --fix, still exits non-zero on the run that first finds the
      # problem, even though the fix is applied to the sandbox's working
      # tree; pipefail carries that non-zero exit through tee so the step,
      # and therefore the job, fails on it same as any other finding.
      # Nothing here commits or pushes: a finding a hook could fix locally
      # is still a finding this job reports and fails on.
      - name: Run pre-commit
        shell: bash
        run: |
          set -o pipefail
          pre-commit run --all-files --show-diff-on-failure --color always 2>&1 | tee pre-commit.log

      # Captured as a job output rather than posted from here, so the step
      # that holds pull-requests: write lives in its own job with no
      # checkout and no hook code; see "Post Pre-Commit Log" below. This
      # step needs none of that: it only reads a file this job already
      # produced and writes plain text to its own output.
      #
      # always(), because the log is worth posting whether pre-commit
      # passed or failed, and a failed "Run pre-commit" step would
      # otherwise skip everything after it.
      - name: Capture pre-commit log for the PR comment
        id: capture
        if: always()
        shell: bash
        run: |
          if [ -f pre-commit.log ]; then
            # ANSI color codes survive `--color always` into the log
            # file; GitHub renders them as literal escape junk inside a
            # fenced code block, so strip them rather than translate
            # them to Markdown.
            esc=$'\x1b'
            log=$(sed -E "s/${esc}\[[0-9;]*m//g" pre-commit.log)
          else
            log="(no log was produced)"
          fi

          max_length=60000
          if [ "${#log}" -gt "$max_length" ]; then
            log="${log:0:$max_length}"$'\n'"... (log truncated)"
          fi

          # A random delimiter, not a fixed word such as EOF, so a log
          # line that happens to read like the delimiter cannot end the
          # output early and splice arbitrary extra "outputs" in behind
          # it.
          delimiter=$(openssl rand -hex 16)
          {
            echo "log<<$delimiter"
            echo "$log"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  pr-comment:
    name: Post Pre-Commit Log
    needs: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    # !cancelled() rather than always(): the log is worth posting whether
    # pre-commit passed or failed, but not if the run was cancelled out
    # from under it, which always() would still post for.
    if: >-
      !cancelled() &&
      github.event.pull_request.head.repo.fork != true
    permissions:
      pull-requests: write
    steps:
      - name: Post the pre-commit log to the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Passed through the environment rather than spliced into the
          # script string below: an env var is read at runtime through
          # process.env and can never break out of its own value to run
          # as script text, which is what keeps a pre-commit log (this
          # job runs no checkout and no hook code itself, but the log
          # content still originates from the pull request's own files)
          # from being a template-injection vector here.
          PRE_COMMIT_LOG: ${{ needs.pre-commit.outputs.log }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const header =
              process.env.PRE_COMMIT_RESULT === "success"
                ? "### Pre-commit passed"
                : "### Pre-commit failed";

            const commentBody =
              `${header}\n<details>\n<summary>Show pre-commit log</summary>\n\n` +
              "```text\n" + process.env.PRE_COMMIT_LOG + "\n```\n</details>";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody,
            });

  self-test:
    name: Self-Test Suite
    runs-on: ubuntu-24.04
    # A cold cache building every checklist's hook environment from scratch
    # (Python, Node, and a pre-commit-managed Go toolchain download for
    # shfmt) took real time to establish locally; 20 minutes leaves headroom
    # over tests/run_tests.sh's five phases together, including the two
    # throwaway /tmp repos the consumer/commit phases build.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref }}
          # This job only runs the test suite; it never pushes, so the
          # checkout has no use for a persisted credential.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      # Docker, Node/npm and shellcheck ship on the ubuntu-24.04 runner
      # image already; see tests/README.md's "What each phase needs
      # installed" for the full list this satisfies.
      - name: Install Python-based tooling
        run: pip install "pre-commit==4.5.1" pyyaml detect-secrets

      - name: Run the self-test suite
        run: tests/run_tests.sh
