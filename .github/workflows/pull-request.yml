---
# cspell:words zizmor
name: PR Validation

# Two gates on every pull request against main: pre-commit (this repo's
# own dogfood config) and the tests/ self-test suite, plus a labeler pass.
# Nothing here needs a personal access token; a public repo cloning
# itself, applying labels, and pushing an auto-fix commit back to the PR
# branch is everything the default GITHUB_TOKEN is scoped for. No other
# services are wired into this pipeline. The auto-fix commit and push run
# in their own job, separate from the pre-commit job that executes third
# party hook code, so the only GITHUB_TOKEN ever minted with permission
# to write to the repository is one that hook code never runs alongside.

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# A new push supersedes whatever this workflow is still doing for the same
# PR, so a rapid series of pushes doesn't leave several stale runs racing
# each other, each capable of pushing its own auto-fix commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  # Flip to false to make every job report-only: findings still show up in
  # logs and the PR comment, but nothing is auto-committed back to the PR
  # branch.
  AUTO_APPLY_FIXES: true

jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # This job only reads the tree to decide which labels apply; it
          # never pushes, so the checkout has no use for a persisted
          # credential.
          persist-credentials: false

      - name: Apply labels from .github/labeler.yml
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  pre-commit:
    name: Pre-Commit Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    outputs:
      changes: ${{ steps.pre-commit.outputs.changes }}
      # Mirrors the workflow level AUTO_APPLY_FIXES flag into a job
      # output: a job level if: below (on push-fixes) can only see the
      # github, needs, vars and inputs contexts, not env, so push-fixes
      # reads this output instead of env.AUTO_APPLY_FIXES directly.
      apply_fixes: ${{ env.AUTO_APPLY_FIXES }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref }}
          # Turned off, deliberately: "Run pre-commit" below shells out to
          # a nested `pre-commit run` per checklist, which downloads and
          # executes third party tool environments with write access to
          # this whole checkout, .git included. This job's own
          # GITHUB_TOKEN has no contents: write permission at all (see
          # permissions: above), so a hook that plants a git hook or
          # hijacks PATH here finds nothing worth stealing. The auto-fix
          # commit and push happen in the separate push-fixes job below,
          # on a checkout none of this hook code ever touched.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Only the checklists/pre-commit-config side of the hook environment
      # cache; the Terraform/tflint binaries below are cached by their own
      # setup actions.
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml', 'checklists/*.yaml') }}
          restore-keys: |
            pre-commit|

      # checklist-dev-terraform (terraform-fmt, terraform-validate, tflint)
      # expects both binaries already on PATH; the hook itself installs
      # nothing. terraform_wrapper: false so terraform-validate talks to the
      # real binary rather than hashicorp's stdout-wrapping shim.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: Install pre-commit
        run: pip install "pre-commit==4.5.1"

      - name: Run pre-commit
        id: pre-commit
        shell: bash
        run: |
          set +o errexit
          pre-commit run --all-files --show-diff-on-failure --color always 2>&1 | tee pre-commit.log
          __exit=${PIPESTATUS[0]}
          set -o errexit

          if [ "${__exit}" -eq 0 ]; then
            echo "changes=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ -z "$(git status --porcelain)" ]; then
            # Failed, and nothing was auto-fixed: real findings the PR needs
            # to address by hand (or a pre-existing, documented failure; see
            # tests/README.md and docs/). Fail the job as-is.
            echo "changes=false" >> "${GITHUB_OUTPUT}"
            exit "${__exit}"
          fi

          echo "changes=true" >> "${GITHUB_OUTPUT}"

      - name: Save auto-fix patch
        if: steps.pre-commit.outputs.changes == 'true' && env.AUTO_APPLY_FIXES == 'true'
        run: |
          # Captures whatever the hooks above changed as a plain diff,
          # staged first so new files a hook created are included too.
          # Nothing here commits or pushes: this job's GITHUB_TOKEN cannot
          # push (see permissions: above), and even if it could, the
          # working tree, PATH and everything else a hook already ran
          # against in this job is not state the privileged push should
          # trust. The push-fixes job below applies this patch against
          # its own, separate checkout instead of reusing any of it.
          git add -A
          git diff --staged --binary > pre-commit-fixes.patch

      - name: Upload auto-fix patch
        if: steps.pre-commit.outputs.changes == 'true' && env.AUTO_APPLY_FIXES == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pre-commit-fixes-patch
          path: pre-commit-fixes.patch
          retention-days: 1

      # Nothing pushed above, so re-running here, against the same
      # already-fixed working tree the patch was taken from, is what
      # proves the fix actually cleared the findings; its exit code is
      # what this job (and therefore the required check) reports.
      # push-fixes only runs once this job succeeds, so a fix this re-run
      # finds incomplete is never pushed.
      - name: Re-run pre-commit after auto-fixes
        if: steps.pre-commit.outputs.changes == 'true' && env.AUTO_APPLY_FIXES == 'true'
        run: |
          pre-commit run --all-files --show-diff-on-failure --color always \
            2>&1 | tee -a pre-commit.log

      - name: Post the pre-commit log to the PR
        if: always()
        # zizmor: ignore[template-injection] job.status is set by the
        # runner itself to one of a fixed enum ("success", "failure",
        # "cancelled", "skipped"); it is never derived from PR content or
        # any other attacker-controllable input, so it cannot carry
        # injected script.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");

            let log = "(no log was produced)";
            try {
              log = fs.readFileSync("pre-commit.log", "utf8").trim();
            } catch (err) {
              // Nothing to attach; the comment below still posts.
            }

            // ANSI color codes survive `--color always` into the log file;
            // GitHub renders them as literal escape junk inside a fenced
            // code block, so strip them rather than trying to translate
            // them to Markdown. \x1b is the ESC byte that starts every SGR
            // sequence (e.g. ESC[32m); written as an escape here rather
            // than a literal control character so this file stays plain
            // text on disk.
            const ansiPattern = new RegExp("\\x1b\\[[0-9;]*m", "g");
            log = log.replace(ansiPattern, "");

            const maxLength = 60000;
            let body = log;
            if (body.length > maxLength) {
              body = body.slice(0, maxLength) + "\n... (log truncated)";
            }

            const header =
              "${{ job.status }}" === "success"
                ? "### Pre-commit passed"
                : "### Pre-commit failed";

            const commentBody =
              `${header}\n<details>\n<summary>Show pre-commit log</summary>\n\n` +
              "```text\n" + body + "\n```\n</details>";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody,
            });

  push-fixes:
    name: Push auto-fixes
    needs: pre-commit
    if: needs.pre-commit.outputs.changes == 'true' && needs.pre-commit.outputs.apply_fixes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref }}
          # This checkout never runs pre-commit, or any other third party
          # hook code: it exists only to receive the patch the pre-commit
          # job produced and push it. Nothing has touched this working
          # tree, its .git directory, or this job's PATH, so there is no
          # planted hook and no PATH hijack for the token below to be
          # exposed to.
          persist-credentials: false

      - name: Download auto-fix patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pre-commit-fixes-patch
          # Outside the checkout on purpose: the patch only needs to be
          # readable by the apply step below, and a copy left inside the
          # working tree would be untracked content `git add -A` cannot
          # tell apart from a real auto-fix, landing the patch itself in
          # the commit it is meant to produce.
          path: ${{ runner.temp }}/pre-commit-fixes-patch

      - name: Apply and commit auto-fixes
        run: |
          git apply --binary "${{ runner.temp }}/pre-commit-fixes-patch/pre-commit-fixes.patch"
          git config user.name "github-actions[bot]"
          # This repo's own commit identity throughout, not
          # github-actions[bot]'s own noreply address: kept to one email
          # across the whole history, human and automated commits alike.
          git config user.email "ivan-pinatti@users.noreply.github.com"
          git add -A

          # No credential exists yet at this point (persist-credentials
          # is false above, and PUSH_TOKEN below is not introduced until
          # the next step), so a commit needs no defense against a
          # credential leaking, only against a hook running at all.
          # core.hooksPath and --no-verify are set anyway, belt and
          # braces: this checkout has no hooks of its own to disable, but
          # core.hooksPath covers every hook type a repo could have
          # (post-commit included) while --no-verify only reaches
          # pre-commit and commit-msg, so between the two, nothing this
          # commit could trigger is left uncovered.
          git -c core.hooksPath=/dev/null commit --no-verify \
            -m "style: apply pre-commit auto-fixes"

      - name: Push auto-fixes
        env:
          # Scoped to this one step, the last thing this job does. Nothing
          # before it in this job has run any code this token could be
          # exposed to, and nothing runs after it.
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This is the only place in the workflow that materializes a
          # credential, via -c on this single git invocation rather than
          # a `git config` call that would write it to .git/config, so it
          # never lands on disk.
          basic_credential=$(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 -w0)
          # GitHub only redacts the exact PUSH_TOKEN string from logs; this
          # base64 encoding of it is a different string that redaction
          # would not catch on its own, so it is registered for masking
          # explicitly too, the same defense actions/checkout's own
          # persist-credentials implementation applies to this identical
          # value.
          echo "::add-mask::${basic_credential}"
          auth_header="AUTHORIZATION: basic ${basic_credential}"
          # core.hooksPath and --no-verify again, for the one client side
          # hook a push can still run (pre-push) that the commit above
          # could not have triggered. Same belt and braces reasoning as
          # the commit step: nothing legitimate to disable on this
          # checkout, only a hypothetical planted hook.
          git -c core.hooksPath=/dev/null \
            -c http.https://github.com/.extraheader="${auth_header}" \
            push --no-verify origin "HEAD:${GITHUB_HEAD_REF}"

  self-test:
    name: Self-Test Suite
    runs-on: ubuntu-24.04
    # A cold cache building every checklist's hook environment from scratch
    # (Python, Node, and a pre-commit-managed Go toolchain download for
    # shfmt) took real time to establish locally; 20 minutes leaves headroom
    # over tests/run_tests.sh's five phases together, including the two
    # throwaway /tmp repos the consumer/commit phases build.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref }}
          # This job only runs the test suite; it never pushes, so the
          # checkout has no use for a persisted credential.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      # Docker, Node/npm and shellcheck ship on the ubuntu-24.04 runner
      # image already; see tests/README.md's "What each phase needs
      # installed" for the full list this satisfies.
      - name: Install Python-based tooling
        run: pip install "pre-commit==4.5.1" pyyaml detect-secrets

      - name: Run the self-test suite
        run: tests/run_tests.sh
