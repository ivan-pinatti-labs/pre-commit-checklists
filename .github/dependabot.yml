version: 2
updates:
  # Covers the root .pre-commit-config.yaml (this repo's own dogfood config).
  # It does NOT cover checklists/checklist-*.yaml: Dependabot's pre-commit
  # ecosystem only ever reads a file literally named .pre-commit-config.yaml
  # in the given directory, so those pins are handled by Renovate instead.
  # See .github/renovate.json5.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      # Daily, matching Renovate below. Note Dependabot's "daily" means
      # weekdays only, not all seven days.
      #
      # This was Wednesday until 2026-09-02, this repository's slot out of a
      # per-repository table in the org's BOT_SCHEDULE.md, picked so its runs
      # would not collide hour for hour with another repository's and queue
      # behind them for CodeRabbit's installation-wide review quota. The
      # premise was wrong in the same way renovate.json5 below already
      # explains for Renovate: a pin-only Dependabot bump resolves
      # `Review Verified` through the bot lane with CodeRabbit never asked,
      # so it spends no review quota either. That table was rationing
      # something neither bot consumed, and the weekly slot stacked on the
      # cooling window below exactly as it would have for Renovate.
      interval: daily
      time: "06:00"
      timezone: "America/Toronto"
    # A cooling window before a bump is even offered, mirroring the
    # reasoning behind Renovate's own minimumReleaseAge in renovate.json5:
    # `Pin Only` is explicit in its own docstring that it can tell a diff
    # changed nothing but a version, not that the version is safe, since a
    # fresh supply chain compromise has no advisory yet for any scanner to
    # match. Age is the only defence against that, and a pre-commit hook
    # runs arbitrary code on every contributor's machine, so this ecosystem
    # is not a smaller attack surface than the one Renovate already waits
    # on. Seven days, the same floor as Renovate's, so both bots hold a bump
    # to the same standard rather than one being stricter for no reason.
    # default-days only: semver-major-days/semver-minor-days/semver-patch-days
    # are supported only for a specific ecosystem list that does not include
    # pre-commit or github-actions, so setting them here would be config
    # that silently does nothing. Applies to ordinary version updates only,
    # not to Dependabot security updates, the same carve-out
    # vulnerabilityAlerts.minimumReleaseAge: null makes in renovate.json5: a
    # fix for a known vulnerability is not made safer by aging.
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - pre-commit
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5

  # Covers every uses: line under .github/workflows/. Every workflow here
  # pins actions to a full commit SHA with a trailing "# vX.Y.Z" comment
  # (see new-tag-and-release.yml and pull-request.yml, and the merge
  # pipeline workflows ported alongside this file: coderabbit-gate.yml,
  # coderabbit-review-queue.yml, bot-auto-merge.yml), which is the format
  # Dependabot needs to resolve a bump: it reads the comment to find the
  # current version, then rewrites both the SHA and the comment together.
  # No extra config is needed for that, it is native to this ecosystem.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # See the pre-commit ecosystem above for why daily. The 30 minute
      # offset it used to carry went with the weekday: it staggered two
      # ecosystems inside one repository's reserved hour, and there is no
      # reserved hour any more.
      interval: daily
      time: "06:00"
      timezone: "America/Toronto"
    # Same cooling window as the pre-commit ecosystem above, for the same
    # reason: a GitHub Actions bump executes arbitrary code in CI, which is
    # at least as large an attack surface as a pre-commit hook, not a
    # smaller one.
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
