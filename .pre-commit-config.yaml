---
# This repository's own dogfood config: it runs the same checklists and
# scripts this repo ships to consumers, via `repo: local` rather than a
# self-referencing `repo: ./`, since a self-reference needs a tagged rev
# and this repo has not cut a release yet. Once tagged, consumers use
# `repo: https://github.com/ivan-pinatti-labs/pre-commit-checklists` with a
# `rev:` pin instead of this file.
default_install_hook_types: [pre-commit, pre-push, commit-msg]
minimum_pre_commit_version: 4.0.1
# The should-fail/ fixtures are deliberately malformed: each one exists
# precisely so a checklist rejects it. Linting them here would report ~110
# failures that are all correct behaviour, and the auto-fixing hooks would
# rewrite them in place, repairing the very defects they demonstrate. Their
# exit codes are asserted by tests/run_tests.sh instead.
#
# should-pass/ is deliberately NOT excluded: those files are valid, they
# should survive a root run untouched, and tests/scripts/check_hooks.sh
# re-runs them through this config to prove the wiring still selects them.
exclude: ^tests/fixtures/[^/]+/should-fail/
repos:
  - repo: local
    hooks:
      - id: checklist-basic
        name: Basic Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-basic]
        stages: [pre-commit]
        require_serial: true
        verbose: true

      - id: checklist-spell
        name: Spelling Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-spell]
        stages: [pre-commit]
        require_serial: true
        verbose: true

      - id: checklist-json
        name: JSON Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-json]
        stages: [pre-commit]
        types_or: [json, json5]
        require_serial: true
        verbose: true

      - id: checklist-markdown
        name: Markdown Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-markdown]
        stages: [pre-commit]
        types: [markdown]
        require_serial: true
        verbose: true

      - id: checklist-toml
        name: TOML Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-toml]
        stages: [pre-commit]
        types: [toml]
        require_serial: true
        verbose: true

      - id: checklist-xml
        name: XML Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-xml]
        stages: [pre-commit]
        types: [xml]
        require_serial: true
        verbose: true

      - id: checklist-yaml
        name: YAML Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-yaml]
        stages: [pre-commit]
        types: [yaml]
        require_serial: true
        verbose: true

      - id: checklist-security-credentials
        name: Security Checklist - Credentials
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-security-credentials]
        stages: [pre-commit, pre-merge-commit]
        require_serial: true
        verbose: true

      - id: checklist-git-valid-branches
        name: Git - Valid Branch Name Checklist
        language: script
        entry: ./scripts/check-branch-name.sh
        stages: [pre-commit, pre-merge-commit]
        pass_filenames: false
        always_run: true
        require_serial: true
        verbose: true

      - id: checklist-git-protected-branches
        name: Git - Protected Branches Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-git-protected-branches]
        stages: [pre-commit, pre-merge-commit]
        pass_filenames: false
        always_run: true
        require_serial: true
        verbose: true

      - id: checklist-git-commit-msg
        name: Git - Commit Message Checklist
        language: script
        entry: ./scripts/check-commit-msg.sh
        stages: [commit-msg]
        files: ^\.git/COMMIT_EDITMSG$
        require_serial: true
        verbose: true

      - id: checklist-github-actions
        name: GitHub - Actions Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-github-actions]
        stages: [pre-commit]
        files: ^\.github/
        require_serial: true
        verbose: true

      # Defect 2 fix: the file selector below is `files:` matching dotfile
      # `.env` variants, not `types: [json]`. The old selector meant this
      # hook never saw a single .env file; pre-commit ANDs `types` and
      # `files` together, and a dotenv file is never typed `json`.
      - id: checklist-dev-dotenv
        name: Development - DotENV Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-dev-dotenv]
        stages: [pre-commit]
        files: '(^|/)\.env(\..+)?$'
        require_serial: true
        verbose: true

      - id: checklist-dev-editorconfig
        name: Development - .editorconfig Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-dev-editorconfig]
        stages: [pre-commit]
        require_serial: true
        verbose: true

      - id: checklist-dev-shell
        name: Development - Bash/Shell Script Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-dev-shell]
        stages: [pre-commit]
        types: [shell]
        require_serial: true
        verbose: true

      # Defect 3 fix: `types_or: [python]` combined with
      # `files: ^requirements\.txt$` ANDed together, resolving to "Python
      # files literally named requirements.txt" -- matching nothing. A
      # hook that should catch both *.py files and requirements.txt needs
      # one `files:` alternation, not two selector keys combined.
      - id: checklist-dev-python
        name: Development - Python Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-dev-python]
        stages: [pre-commit]
        files: '(\.py$|(^|/)requirements\.txt$)'
        require_serial: true
        verbose: true

      - id: checklist-dev-terraform
        name: Development - Terraform Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-dev-terraform]
        stages: [pre-commit]
        files: \.tf$
        require_serial: true
        verbose: true

      - id: checklist-dev-javascript
        name: Development - JavaScript Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-dev-javascript]
        stages: [pre-commit]
        types: [javascript]
        require_serial: true
        verbose: true

      - id: checklist-dev-typescript
        name: Development - TypeScript Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-dev-typescript]
        stages: [pre-commit]
        files: \.ts$
        require_serial: true
        verbose: true

      - id: checklist-dev-docker
        name: Development - Dockerfile Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-dev-docker]
        stages: [pre-commit]
        types: [dockerfile]
        require_serial: true
        verbose: true

      # No selector here on purpose. Unlike every other id in this file,
      # checkmake's own hook manifest already carries `types: [makefile]`,
      # so run-checklist.sh hands it whatever pre-commit selected and the
      # pinned hook filters from there. Adding a second selector would
      # only be a chance to get it wrong.
      - id: checklist-dev-make
        name: Development - Makefile Checklist
        language: script
        entry: ./scripts/run-checklist.sh
        args: [checklist-dev-make]
        stages: [pre-commit]
        require_serial: true
        verbose: true

  # CITATION.cff is the one file here that `checklist-yaml` above cannot
  # reach. It is YAML, but `identify` tags it only `text`, since the tag comes
  # from the extension and `.cff` is not one it knows. Widening that id's
  # `types:` would not help either: check-yaml and yamllint inside
  # checklists/checklist-yaml.yaml both carry `types: [file, yaml]` of their
  # own, which pre-commit ANDs with whatever the consumer asks for, so the
  # file is dropped by the hook rather than by the id's selector. This is the
  # "Why the selector matters" case from docs/hook-catalogue.md, seen from the
  # inside.
  #
  # Overriding `types:` has to happen where the hook is declared, which is why
  # this is its own repo entry rather than a change to the id above. Whether
  # `checklist-yaml` should grow `.cff` coverage for every consumer is a
  # separate question, tracked as an issue rather than decided here.
  #
  # Worth covering because GitHub reads the file for the "Cite this
  # repository" widget, where a file it cannot use produces nothing at all
  # rather than an error anyone would see.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: yamllint (CITATION.cff)
        files: ^CITATION\.cff$
        types: [text]
        stages: [pre-commit]

  # The other half, because yamllint cannot do it: the Citation File Format
  # schema. Not a theoretical gap. The author block in this repository's own
  # CITATION.cff used to read `name:` and `url:`, and `url` is not a key CFF
  # has at all (the person and entity definitions both spell it `website`), so
  # the file had never been valid while parsing as YAML perfectly well the
  # whole time.
  #
  # cffconvert is the reference implementation's own validator, run as a
  # repo: local hook since it ships no `.pre-commit-hooks.yaml`. Its version
  # is pinned in `additional_dependencies`, which the native pre-commit
  # manager does not read, so that pin moves by hand.
  #
  # pass_filenames is false with the path written out because cffconvert takes
  # its input through `-i` and rejects a bare positional argument, so an
  # appended filename would fail the hook on a valid file. `files:` still
  # scopes it to that one file.
  - repo: local
    hooks:
      - id: cffconvert-validate
        name: Validate CITATION.cff against the CFF schema
        language: python
        additional_dependencies: ["cffconvert==2.0.0"]
        entry: cffconvert --validate -i CITATION.cff
        files: ^CITATION\.cff$
        pass_filenames: false
        stages: [pre-commit]
