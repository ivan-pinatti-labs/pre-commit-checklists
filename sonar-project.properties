# SonarQube Cloud analysis settings, read by .github/workflows/sonarqube.yml.
# The project is analyzed from CI with Automatic Analysis turned off in the
# project settings: the two cannot run side by side, and a CI scan aborts
# while Automatic Analysis is on.
sonar.organization=ivan-pinatti-labs
sonar.projectKey=ivan-pinatti-labs_pre-commit-checklists
sonar.projectName=pre-commit-checklists

# Sources are the whole tree rather than a list of folders, so a new file is
# analyzed without anyone remembering to add it here. Sonar only reads the
# languages it has an analyzer for (the shell under scripts/, the L2
# Dockerfile, YAML and the GitHub Actions workflows here) plus its secrets
# detection, which runs over every text file. templates/ stays in scope on
# purpose: consumers copy those files into their own repositories, so they
# ship just like scripts/ does.
#
# tests/ is analyzed as test code, which Sonar holds to a different rule set,
# so it is excluded from sources to keep the two disjoint.
# .secrets.baseline is generated by detect-secrets and only records hashes.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,.secrets.baseline
sonar.test.inclusions=tests/**

# The fixtures are left out entirely, should-pass and should-fail alike. The
# should-fail ones are deliberately defective (Python calling subprocess with
# shell=True, a fake RSA private key, a .env holding an api_key, broken
# workflows, a broken Dockerfile), because each exists so a checklist
# rejects it, and Sonar would flag them forever with no fix available. The
# should-pass ones are inputs to the hooks under test rather than code this
# repository runs or ships. pre-commit and codeql.yml skip the same files.
sonar.test.exclusions=tests/fixtures/**

# The interpreter the Pre-commit and Tests jobs run, so Python rules that
# depend on the language version judge tests/scripts/test_selector_lint.py
# against the one it actually runs on.
sonar.python.version=3.12

sonar.sourceEncoding=UTF-8
