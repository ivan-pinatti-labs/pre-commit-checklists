# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.json
#
# CodeRabbit reads AGENTS.md as review guidelines (listed explicitly under
# knowledge_base below, next to the docs it points to), so its rules are
# not restated here beyond the organization's shared review rules.

language: en-US

reviews:
  auto_review:
    # Never stop reviewing a branch for being busy. The default is 5, which
    # pauses automatic reviews once five commits on a branch have been
    # reviewed, and the pause is silent: the CodeRabbit check still reports
    # green, so the pull request looks reviewed when nothing has read its
    # current head.
    #
    # Observed directly on this repository's pull request 12, a branch with
    # seven commits: automatic reviews stopped after the fifth, and twelve
    # hours passed with no review of the head commit and no indication that
    # anything was waiting. Recovering needs a manual `@coderabbitai review`.
    #
    # The reviews this saves are on fixup commits, which is real, but a
    # review that silently stops is worse than one that costs a slot.
    auto_pause_after_reviewed_commits: 0

    # CodeRabbit is a GitHub App posting a check, not a workflow job, so it
    # cannot be ordered after the linters with `needs:` the way a workflow
    # job can. Skipping drafts is the lever instead: open a pull request as
    # a draft (see AGENTS.md, "Pull requests"), let pre-commit finish, then
    # mark it ready. CodeRabbit then reviews once, against a diff the
    # mechanical linters and checklists have already cleaned, instead of
    # re-reviewing after every fixup commit.
    #
    # This is the default. Stated explicitly because the review order
    # depends on it, and a default that quietly changed would change the
    # order with it.
    drafts: false
  path_filters:
    # Deliberately malformed fixtures: every file under a should-fail/
    # directory exists so a checklist hook rejects it. Reviewing them as
    # real code would flag the very defects they exist to demonstrate;
    # tests/run_tests.sh asserts their exit codes instead.
    - "!tests/fixtures/**/should-fail/**"
  tools:
    # Each of these already runs as a pre-commit hook in this repo's own
    # dogfood config (see .pre-commit-config.yaml: checklist-yaml,
    # checklist-github-actions, checklist-dev-shell, checklist-markdown),
    # so nothing is lost by not running it a second time here.
    yamllint:
      enabled: false
    actionlint:
      enabled: false
    shellcheck:
      enabled: false
    markdownlint:
      enabled: false
  # How hard to look. assertive raises more than chill does; every consumer
  # repository runs what this library ships, so a hook that silently matches
  # nothing or a script that leaks a secret costs more than an extra
  # comment.
  profile: assertive

  # Review guidance. The first two entries are the organization's rules,
  # kept the same in every ivan-pinatti-labs repository; the rest are
  # specific to pre-commit-checklists. Pre-commit already runs the linters,
  # so these ask for judgment the hooks cannot make.
  path_instructions:
    - path: "**"
      instructions: |
        This repository is public. Flag, as a blocking issue, anything in the
        diff that should not be published:
        - secrets, tokens, keys, passwords, session cookies, connection
          strings, or anything that looks like one, even in tests or docs;
        - personal data: names other than the maintainer's public handle,
          email addresses other than a users.noreply.github.com one, phone
          numbers, physical addresses;
        - machine specific details: absolute home paths (/home/<user>,
          /Users/<user>), host names, LAN or private IP addresses, internal
          domains, cloud account IDs, ARNs, AWS profile names, cluster
          contexts, and details of anyone's own deployment;
        - AI attribution in any file, commit message or the pull request
          text: a Co-Authored-By trailer naming an AI agent, a "Generated
          with" line, an agent session link, or any other line that names
          or links the agent that wrote the change.
        Also check that every behavior change comes with tests that would
        fail without it, and that the docs describe the new behavior. The
        organization's rule is 100% test coverage of the code it ships:
        flag, as a blocking issue, any new or changed line or branch of code
        (not docs or configuration) that no test exercises, and name the
        test that would cover it. Do not comment on formatting the
        pre-commit hooks already enforce.
    - path: "**/*.md"
      instructions: |
        Prose does not use a hyphen, em dash or en dash as punctuation; use
        commas, parentheses or separate sentences (hyphens inside compound
        words, code, paths and flags are fine). Point out claims the code in
        this pull request does not back up.
    - path: "checklists/checklist-*.yaml"
      instructions: >
        Each file is a standalone pre-commit config, not a fragment: it is
        consumed on its own through scripts/run-checklist.sh. A hook id's
        types:/types_or: and files: selectors are ANDed together by
        pre-commit, not ORed, so combining them can silently narrow a hook
        to matching nothing at all. Flag any hook id whose combined
        selectors could match fewer files than either selector reads as
        matching alone, and check that the rev: pin is a real, current tag
        of the named upstream repo.
    - path: ".pre-commit-hooks.yaml"
      instructions: >
        Defines every hook id this library exposes to consumers. A new or
        renamed hook id here needs a matching entry in
        docs/hook-catalogue.md, and a removed or renamed one is a major
        version change per docs/versioning.md.
    - path: "scripts/**"
      instructions: |
        These scripts run as hook entries inside every consumer repository,
        and install.sh is piped into bash. Flag any change that prints the
        environment or another value that could carry a secret into hook
        or CI output, a new or changed exit status missing from the
        script's leading comment block, and any new line no case in
        tests/scripts/script_units.sh runs (docs/CONTRIBUTING.md,
        "Coverage"). A change to what install.sh copies or pins must stay
        in sync with docs/getting-started.md.

  # Pull request checks shown in the walkthrough. Warnings, not errors: the
  # merge pipeline already gates on CodeRabbit's review through Review
  # Verified (docs/MERGE_PIPELINE.md).
  pre_merge_checks:
    title:
      mode: warning
      requirements: >-
        Conventional Commits: type(optional scope): imperative subject,
        lowercase, no trailing period, at most 72 characters.
    description:
      mode: warning
    custom_checks:
      - name: Public repository hygiene
        mode: warning
        instructions: >-
          Fail if the diff, commit messages or pull request text add a secret
          or something that looks like one, an email address other than a
          users.noreply.github.com one, an absolute home path, a private or
          machine specific host name, a private IP address, a cloud account ID
          or ARN, or details of a personal deployment. Pass otherwise.
      - name: No AI attribution
        mode: warning
        instructions: >-
          Fail if any commit message, the pull request title or description,
          or any file in the diff contains a Co-Authored-By trailer naming an
          AI agent, a "Generated with" line, an agent session link, or any
          other line that names or links the AI agent that made the change.
          Pass otherwise.

# Tone of review comments and chat.
tone_instructions: >-
  Direct and specific: lead with the defect and a concrete fix, in plain
  words. No praise, no emoji, no hype. Skip style points a linter already
  reports.

# The repository's own rules, read as coding guidelines for every review.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
      # Guidelines outside the root apply only to their own folder unless
      # applyTo widens them, and these govern the whole repository.
      - files: "docs/CONTRIBUTING.md,docs/hook-catalogue.md,docs/versioning.md,docs/overrides.md"
        applyTo: "**/*"
