---
# Formatting and linting moved to ruff, which replaces black + isort in one
# tool. pre-commit/mirrors-isort is archived upstream, and ruff-format is a
# drop-in black-compatible formatter, so this covers the same ground with
# one fewer moving part.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-builtin-literals
      - id: debug-statements
      - id: name-tests-test
        args: ["--django"]
      - id: requirements-txt-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
