---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: local
    hooks:
      - id: prettier-yaml
        name: Run Prettier on YAML files
        entry: prettier --write
        language: node
        additional_dependencies: ["prettier"]
