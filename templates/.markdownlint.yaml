# Checked by checklist-markdown (markdownlint-cli2).

# Automatically fix problems markdownlint-cli2 knows how to fix.
fix: true

# MD013: line-length, set to 100. This is the sole enforcement of Markdown
# line length: .editorconfig should leave max_line_length unset for *.md,
# because editorconfig-checker cannot tell that a wrapped pipe table or a
# fenced code block is not a violation. Turned off inside code blocks and
# tables here for the same reason.
MD013:
  line_length: 100
  code_blocks: false
  tables: false
