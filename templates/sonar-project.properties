# SonarQube Cloud analysis settings for a consumer of pre-commit-checklists,
# read by templates/workflows/sonarqube.yml once both are copied in. This one
# goes to the repository root.
#
# No sonar.organization or sonar.projectKey here, on purpose. The workflow
# passes both, built from the repository it runs in (`<owner>_<repository
# name>`), which is the key SonarQube Cloud gives a project imported from
# GitHub by default, so this file works unedited in any repository.

# Sources are the whole tree rather than a list of files, so a new file is
# analyzed without anyone remembering to add it here. Sonar only reads the
# languages it has an analyzer for, plus its secrets detection, which runs
# over every text file. .secrets.baseline is generated by detect-secrets
# (checklist-security-credentials) and only records hashes.
sonar.sources=.
sonar.exclusions=.secrets.baseline

# With tests, analyze them as test code, which Sonar holds to a different
# rule set, and keep them out of the sources above:
#
#   sonar.tests=tests
#   sonar.test.inclusions=tests/**
#   sonar.exclusions=.secrets.baseline,tests/**
#
# and point SonarQube at the coverage report the workflow writes, for
# example `sonar.python.coverage.reportPaths=coverage.xml`.

sonar.sourceEncoding=UTF-8
