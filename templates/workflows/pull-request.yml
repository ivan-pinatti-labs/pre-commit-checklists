---
name: PR Validation

# A generic starting point for a repo that has adopted this library via one
# of templates/pre-commit-config/*.yaml. Copy this file into your own
# .github/workflows/ and adjust the branch name and Python version to
# taste. No personal access token is needed: cloning this (public) library
# at its pinned rev and checking out your own PR branch both work with the
# default GITHUB_TOKEN's read access. See docs/getting-started.md for the
# rest of the adoption path.

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-commit:
    name: Pre-Commit Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # persist-credentials is set to false because nothing in this job
      # pushes, so the checked out credential has no reason to survive
      # past this step.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit|

      - name: Install pre-commit
        run: pip install pre-commit

      # Add setup steps here for any per-language checklist you selected
      # that needs a toolchain on PATH (Terraform + tflint, for example);
      # see docs/hook-catalogue.md's "Requires" column for the full list.
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color always
