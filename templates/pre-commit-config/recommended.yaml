---
# Recommended starter: file-hygiene, spelling, the common structured file
# types, credential scanning, and the two git-message/branch-name guards.
# A good default for most repos that are not dominated by one language.
#
# Copy this file to .pre-commit-config.yaml at the root of your repo, update
# the `rev:` pin below to the latest release tag, then run:
#
#   pre-commit install
#   pre-commit run --all-files
#
# See docs/getting-started.md for the full walkthrough,
# docs/hook-catalogue.md for what each hook id checks, and
# docs/versioning.md for how the `rev:` pin works and how to bump it.
#
# One id below (checklist-git-commit-msg) runs at the commit-msg git hook
# stage instead of pre-commit, so `default_install_hook_types` tells
# `pre-commit install` to wire both stages up. Every other hook is
# explicitly pinned to `stages: [pre-commit]` so it does not also
# re-run, redundantly, during that commit-msg invocation.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/ivan-pinatti/pre-commit-checklists
    rev: v1.0.0 # replace with the latest release tag
    hooks:
      # Large-file/merge-conflict/line-ending hygiene, safe on any repo.
      - id: checklist-basic
        stages: [pre-commit]

      # Spell-checks every file cspell can read; tune words in .cspell.json.
      - id: checklist-spell
        stages: [pre-commit]

      # Lints and link-checks Markdown.
      - id: checklist-markdown
        types: [markdown]
        stages: [pre-commit]

      # Validates JSON syntax and formats with Prettier.
      # json5 is included deliberately: check-json self-filters on its own
      # types: [json] and skips .json5 (it is a strict JSON parser and would
      # fail on comments and unquoted keys), while Prettier reads json5
      # natively. A .json5 file therefore gets formatted and never
      # syntax-checked, which is the correct split rather than a compromise.
      - id: checklist-json
        types_or: [json, json5]
        stages: [pre-commit]

      # Validates YAML syntax, lints with yamllint, formats with Prettier.
      - id: checklist-yaml
        types: [yaml]
        stages: [pre-commit]

      # Validates TOML syntax.
      - id: checklist-toml
        types: [toml]
        stages: [pre-commit]

      # Validates XML syntax.
      - id: checklist-xml
        types: [xml]
        stages: [pre-commit]

      # Checks .editorconfig rules are respected.
      - id: checklist-dev-editorconfig
        stages: [pre-commit]

      # Lints .env / .env.* files with dotenv-linter/dotenv-linter (Rust);
      # see docs/hook-catalogue.md#which-dotenv-linter. Selector required:
      # this id has no default file type of its own to fall back on.
      - id: checklist-dev-dotenv
        files: '(^|/)\.env(\..+)?$'
        stages: [pre-commit]

      # Blocks committed private keys and known secret patterns. Requires
      # a `.secrets.baseline` file at the repo root; scripts/install.sh
      # (in this library) generates one for you.
      - id: checklist-security-credentials
        stages: [pre-commit]

      # Rejects branch names that skip your naming convention. No ticket
      # prefix is required by default; see docs/overrides.md to opt in.
      - id: checklist-git-valid-branches
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Rejects commit messages that are not Conventional Commits. No
      # ticket prefix is required by default; see docs/overrides.md.
      - id: checklist-git-commit-msg
        stages: [commit-msg]
        files: ^\.git/COMMIT_EDITMSG$

      # Blocks direct commits to your long-lived branches (main, master,
      # develop, staging by default). Adjust the pattern in
      # checklists/checklist-git-protected-branches.yaml if you fork it,
      # or see docs/overrides.md for a config-only way to change it.
      - id: checklist-git-protected-branches
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Lints GitHub Actions workflow files.
      - id: checklist-github-actions
        files: ^\.github/
        stages: [pre-commit]
