---
# Full starter: every hook id this library ships, including all six
# language checklists. Delete the language sections you don't need, or
# start from one of the per-language starters in this directory instead.
#
# Copy this file to .pre-commit-config.yaml at the root of your repo, update
# the `rev:` pin below to the latest release tag, then run:
#
#   pre-commit install
#   pre-commit run --all-files
#
# See docs/getting-started.md for the full walkthrough,
# docs/hook-catalogue.md for what each hook id checks and matches, and
# docs/versioning.md for how the `rev:` pin works and how to bump it.
#
# One id below (checklist-git-commit-msg) runs at the commit-msg git hook
# stage instead of pre-commit, so `default_install_hook_types` tells
# `pre-commit install` to wire both stages up. Every other hook is
# explicitly pinned to `stages: [pre-commit]` so it does not also
# re-run, redundantly, during that commit-msg invocation.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/ivan-pinatti-labs/pre-commit-checklists
    rev: v1.0.0 # replace with the latest release tag
    hooks:
      # -- General file hygiene --------------------------------------
      - id: checklist-basic
        stages: [pre-commit]
      - id: checklist-spell
        stages: [pre-commit]
      - id: checklist-dev-editorconfig
        stages: [pre-commit]

      # -- Structured file types ---------------------------------------
      - id: checklist-markdown
        types: [markdown]
        stages: [pre-commit]
      # json5 is included deliberately: check-json self-filters on its own
      # types: [json] and skips .json5 (it is a strict JSON parser and would
      # fail on comments and unquoted keys), while Prettier reads json5
      # natively. A .json5 file therefore gets formatted and never
      # syntax-checked, which is the correct split rather than a compromise.
      - id: checklist-json
        types_or: [json, json5]
        stages: [pre-commit]
      - id: checklist-yaml
        types: [yaml]
        stages: [pre-commit]
      - id: checklist-toml
        types: [toml]
        stages: [pre-commit]
      - id: checklist-xml
        types: [xml]
        stages: [pre-commit]
      - id: checklist-dev-dotenv
        files: '(^|/)\.env(\..+)?$'
        stages: [pre-commit]

      # -- Security -------------------------------------------------------
      - id: checklist-security-credentials
        stages: [pre-commit]

      # -- Git and GitHub -----------------------------------------------
      - id: checklist-git-valid-branches
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: checklist-git-commit-msg
        stages: [commit-msg]
        files: ^\.git/COMMIT_EDITMSG$
      - id: checklist-git-protected-branches
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: checklist-github-actions
        files: ^\.github/
        stages: [pre-commit]

      # -- Languages: keep only the ones your repo uses -----------------
      - id: checklist-dev-shell
        types: [shell]
        stages: [pre-commit]
      - id: checklist-dev-python
        files: '(\.py$|(^|/)requirements\.txt$)'
        stages: [pre-commit]
      - id: checklist-dev-terraform
        files: \.tf$
        stages: [pre-commit]
      - id: checklist-dev-javascript
        types: [javascript]
        stages: [pre-commit]
      - id: checklist-dev-typescript
        files: \.ts$
        stages: [pre-commit]
      - id: checklist-dev-docker
        types: [dockerfile]
        stages: [pre-commit]
