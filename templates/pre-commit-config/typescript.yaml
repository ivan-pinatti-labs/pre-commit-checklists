---
# TypeScript starter: general file hygiene plus the TypeScript checklist
# (Biome). Add templates/pre-commit-config/recommended.yaml's
# checklist-json hook too if you want package.json/tsconfig.json
# formatted the same way (that one still runs Prettier; only the
# JavaScript and TypeScript checklists moved to Biome).
#
# Copy this file to .pre-commit-config.yaml at the root of your repo, then
# run:
#
#   pre-commit autoupdate --repo https://github.com/ivan-pinatti-labs/pre-commit-checklists
#   pre-commit install
#   pre-commit run --all-files
#
# The first command resolves the `rev:` pin below, which is an example and
# will be out of date: every merge to this library cuts a release, so any tag
# written into this file is usually stale within a day. It is scoped with
# `--repo`, so it touches only this library's entry and never your other
# hooks. `scripts/install.sh` runs it for you, so if you bootstrapped with
# that, the pin is already correct and you can skip it.
#
# checklist-dev-typescript runs Biome's biome-check through a Node
# `additional_dependencies` pin, so a working `node`/`npm` is needed the
# first time pre-commit builds the hook's environment. See
# docs/getting-started.md and docs/hook-catalogue.md.
repos:
  - repo: https://github.com/ivan-pinatti-labs/pre-commit-checklists
    rev: v2.4.0 # an example, see the note above
    hooks:
      - id: checklist-basic

      # Blocks committed private keys and known secret patterns. Requires
      # a `.secrets.baseline` file at the repo root; scripts/install.sh
      # (in this library) generates one for you.
      - id: checklist-security-credentials

      # Formats, lints, and organizes imports in *.ts with Biome.
      - id: checklist-dev-typescript
        files: \.ts$
