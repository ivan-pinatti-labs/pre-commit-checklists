---
# TypeScript starter: general file hygiene plus the TypeScript checklist
# (Prettier). Add templates/pre-commit-config/recommended.yaml's
# checklist-json hook too if you want package.json/tsconfig.json
# formatted the same way.
#
# Copy this file to .pre-commit-config.yaml at the root of your repo, update
# the `rev:` pin below to the latest release tag, then run:
#
#   pre-commit install
#   pre-commit run --all-files
#
# checklist-dev-typescript runs Prettier through `language: node`, so a
# working `node`/`npm` is needed the first time pre-commit builds the
# hook's environment. See docs/getting-started.md and
# docs/hook-catalogue.md.
repos:
  - repo: https://github.com/ivan-pinatti/pre-commit-checklists
    rev: v1.0.0 # replace with the latest release tag
    hooks:
      - id: checklist-basic

      # Blocks committed private keys and known secret patterns. Requires
      # a `.secrets.baseline` file at the repo root; scripts/install.sh
      # (in this library) generates one for you.
      - id: checklist-security-credentials

      # Formats *.ts with Prettier.
      - id: checklist-dev-typescript
        files: \.ts$
