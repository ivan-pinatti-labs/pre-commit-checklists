---
# Minimal starter: the smallest safety net worth having in any repository.
#
# Copy this file to .pre-commit-config.yaml at the root of your repo, then
# run:
#
#   pre-commit install
#   pre-commit run --all-files
#
# The `rev:` pin below is an example, and it will be out of date. Every merge
# to this library cuts a release, so any tag written into this file is usually
# stale within a day. `scripts/install.sh` resolves it at bootstrap, so if you
# used that, it is already correct.
#
# If you copied this file by hand, run this once instead of looking a version
# up. It touches only this library's entry, never your other hooks:
#
#   pre-commit autoupdate --repo https://github.com/ivan-pinatti-labs/pre-commit-checklists
#
# See docs/getting-started.md for the full walkthrough, and
# docs/versioning.md for how the `rev:` pin works and how to bump it.
repos:
  - repo: https://github.com/ivan-pinatti-labs/pre-commit-checklists
    rev: v2.4.0 # an example, see the note above
    hooks:
      # Large-file/merge-conflict/line-ending hygiene, safe on any repo.
      - id: checklist-basic

      # Blocks committed private keys and known secret patterns. Requires
      # a `.secrets.baseline` file at the repo root; scripts/install.sh
      # (in this library) generates one for you.
      - id: checklist-security-credentials
