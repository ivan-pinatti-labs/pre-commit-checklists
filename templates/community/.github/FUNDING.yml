# Funding links for this repository's "Sponsor" button. Every line below
# is commented out on purpose: this file ships as a template used across
# many different repositories, and an active entry here would point
# donations at whoever last edited this file, not at this project's own
# maintainer.
#
# Uncomment and fill in your own accounts, then delete the ones you are
# not using. See GitHub's docs on displaying a sponsor button for the
# full syntax and supported platforms.
#
# github: [REPLACE_WITH_YOUR_GITHUB_USERNAME]
# patreon: REPLACE_WITH_YOUR_PATREON_USERNAME
# open_collective: REPLACE_WITH_YOUR_OPEN_COLLECTIVE_USERNAME
# ko_fi: REPLACE_WITH_YOUR_KO_FI_USERNAME
# custom: ["https://example.com/donate"]
