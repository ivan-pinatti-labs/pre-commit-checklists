# Configuration for markdownlint-cli2, used by checklist-markdown.

# Automatically fix problems markdownlint-cli2 knows how to fix.
fix: true

# MD013: line-length. This is the one tool in this repo that enforces
# Markdown line length; .editorconfig's [*.md] section deliberately sets
# max_line_length = 0 and defers to this rule instead, since MD013 has
# the exceptions that matter (code blocks, tables, an inline disable
# comment for unwrappable tokens such as long URLs) and
# editorconfig-checker has none of them.
MD013:
  line_length: 100
  code_blocks: false
  tables: false

# MD033: no-inline-html. The README's Support block needs raw HTML for the
# centred badge row and the sponsor QR grid; Markdown has no equivalent for
# either. Allow only the elements that block actually uses, so unrelated
# inline HTML elsewhere still gets flagged.
MD033:
  allowed_elements: [a, br, code, div, img, table, td, tr]
